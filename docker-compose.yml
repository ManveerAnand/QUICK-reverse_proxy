# Full demo stack: proxy, three backends, Prometheus, Grafana and Jaeger.
# Start with: make generate-certs && docker compose up -d --build

services:
  quic-proxy:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    container_name: quic-reverse-proxy
    ports:
      - "443:443/udp"    # QUIC / HTTP-3
      - "443:443/tcp"    # HTTPS (advertises HTTP/3 via Alt-Svc)
      - "80:80/tcp"      # plain HTTP fallback
      - "9090:9090/tcp"  # Prometheus metrics
      - "8889:8889/tcp"  # control API (start/stop backends for failover demos)
    volumes:
      - ./configs:/app/configs:ro
      - ./certs:/app/certs:ro
      - ./www:/app/www:ro
      - /var/run/docker.sock:/var/run/docker.sock   # used by the control API
    depends_on:
      - backend1
      - backend2
      - backend3
      - jaeger
    networks:
      - proxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Go HTTP/3-only server (UDP 8081)
  backend1:
    build:
      context: ./examples/h3-backend
      dockerfile: Dockerfile
    container_name: backend1
    networks:
      - proxy-network

  # Two Node.js HTTP/1.1 servers for load balancing and failover
  backend2:
    image: node:18-alpine
    container_name: backend2
    working_dir: /app
    volumes:
      - ./examples/node-backend:/app:ro
    command: ["node", "server.js"]
    environment:
      - PORT=3000
      - SERVER_NAME=backend2
    networks:
      - proxy-network

  backend3:
    image: node:18-alpine
    container_name: backend3
    working_dir: /app
    volumes:
      - ./examples/node-backend:/app:ro
    command: ["node", "server.js"]
    environment:
      - PORT=3000
      - SERVER_NAME=backend3
    networks:
      - proxy-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
    networks:
      - proxy-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards/quic-proxy-dashboard.json:/var/lib/grafana/dashboards/quic-proxy-dashboard.json:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - proxy-network
    restart: unless-stopped
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector (the proxy exports here)
    networks:
      - proxy-network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  proxy-network:
    driver: bridge
