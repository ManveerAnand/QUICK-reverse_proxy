# Prometheus configuration for QUIC Reverse Proxy

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "quic-proxy"
    env: "development"

scrape_configs:
  # QUIC Reverse Proxy metrics
  - job_name: "quic-proxy"
    static_configs:
      - targets: ["quic-proxy:9090"]
    scrape_interval: 10s
    metrics_path: "/metrics"
    scheme: "http"

  # Prometheus itself (scrapes its own metrics)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"] # Internal port, not the exposed 9091
    scrape_interval: 30s
